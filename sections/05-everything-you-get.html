<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everything You Get - Section</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap" rel="stylesheet">

    <style>
        @font-face {
            font-family: 'Ogg';
            src: url('https://cdn.jsdelivr.net/gh/nicxvan/ogg-font@master/fonts/Ogg-Medium.woff2') format('woff2');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Ogg';
            src: url('https://cdn.jsdelivr.net/gh/nicxvan/ogg-font@master/fonts/Ogg-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --pink-primary: #FF6B9D;
            --pink-dark: #C7254E;
            --pink-light: #FFB3D1;
            --teal-primary: #4ECDC4;
            --teal-dark: #2F5F61;
            --teal-light: #A8E6E3;
            --gold: #FFD166;
            --gold-dark: #F4A261;
            --cream: #FAF7F2;
            --navy: #2F5F61;
            --gray-light: #E8E8E8;
            --gray-medium: #999999;
            --gray-dark: #555555;
        }

        body {
            font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 500;
            -webkit-font-smoothing: antialiased;
            color: #333;
            line-height: 1.6;
        }

        h1, h2, h3 {
            font-family: 'Ogg', Georgia, serif;
            font-weight: 700;
        }

        .section {
            background: var(--cream);
            padding: 100px 24px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-title {
            font-family: 'Ogg', Georgia, serif;
            font-size: 48px;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .price-highlight {
            background: linear-gradient(135deg, var(--pink-primary), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .headline-underline {
            display: block;
            width: 120px;
            height: 6px;
            margin: 0 auto;
        }

        /* Component Cards */
        .component-card {
            background: #FFFFFF;
            border-radius: 24px;
            padding: 48px 40px;
            margin-bottom: 32px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 48px;
            align-items: center;
        }

        .component-content h3 {
            font-family: 'Ogg', Georgia, serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 16px;
        }

        .component-content p {
            font-family: 'Satoshi', sans-serif;
            font-size: 17px;
            font-weight: 500;
            color: var(--gray-dark);
            line-height: 1.7;
        }

        /* Day Circles Illustration */
        .day-circles {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .day-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 3px dashed;
        }

        .day-circle:nth-child(1) {
            background: rgba(168, 230, 227, 0.4);
            border-color: var(--teal-light);
            z-index: 3;
        }

        .day-circle:nth-child(2) {
            background: rgba(255, 179, 209, 0.4);
            border-color: var(--pink-light);
            margin-left: -20px;
            z-index: 2;
        }

        .day-circle:nth-child(3) {
            background: rgba(255, 209, 102, 0.4);
            border-color: var(--gold);
            margin-left: -20px;
            z-index: 1;
        }

        .day-circle::before {
            content: '';
            width: 12px;
            height: 12px;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .day-circle:nth-child(1)::before {
            background: var(--teal-dark);
        }

        .day-circle:nth-child(2)::before {
            background: var(--pink-dark);
        }

        .day-circle:nth-child(3)::before {
            background: var(--gold-dark);
        }

        .day-label {
            font-family: 'Caveat', cursive;
            font-size: 18px;
            font-weight: 600;
            position: absolute;
            bottom: -24px;
        }

        .day-circle:nth-child(1) .day-label {
            color: var(--teal-dark);
        }

        .day-circle:nth-child(2) .day-label {
            color: var(--pink-dark);
        }

        .day-circle:nth-child(3) .day-label {
            color: var(--gold-dark);
        }

        .lifetime-label {
            font-family: 'Caveat', cursive;
            font-size: 22px;
            font-weight: 700;
            color: var(--pink-dark);
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Wavy line decoration */
        .wavy-line {
            position: absolute;
            bottom: -30px;
            left: 0;
            width: 80px;
        }

        /* Section divider */
        .section-divider {
            width: 100%;
            height: 40px;
            margin: 40px 0;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .component-card {
                grid-template-columns: 1fr;
                gap: 32px;
                text-align: center;
            }

            .day-circles {
                order: -1;
            }

            .section-title {
                font-size: 36px;
            }
        }

        @media (max-width: 600px) {
            .section {
                padding: 70px 16px;
            }

            .section-title {
                font-size: 30px;
            }

            .component-card {
                padding: 32px 24px;
            }

            .day-circle {
                width: 80px;
                height: 80px;
            }

            .day-label {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<section class="section">
    <div class="container">
        <div class="section-header">
            <h2 class="section-title">Here's Everything You Get for <span class="price-highlight">$67</span></h2>
            <!-- Hand-drawn underline -->
            <svg class="headline-underline" viewBox="0 0 120 6" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2 4 Q 30 1, 60 3 T 118 2" stroke="#FFB3D1" stroke-width="3" fill="none" stroke-linecap="round"/>
            </svg>
        </div>

        <!-- Component 1: Lifetime Recording Access -->
        <div class="component-card">
            <div class="component-content">
                <h3>Lifetime Recording Access</h3>
                <p>Never miss a moment, even when life gets chaotic. Watch at 11pm when kids are asleep, or catch up on weekends.</p>
            </div>
            <div class="day-circles">
                <div class="day-circle">
                    <span class="day-label">Day 1</span>
                </div>
                <div class="day-circle">
                    <span class="day-label">Day 2</span>
                </div>
                <div class="day-circle">
                    <span class="day-label">Day 3</span>
                </div>
                <span class="lifetime-label">Lifetime!</span>
                <!-- Wavy line decoration -->
                <svg class="wavy-line" viewBox="0 0 80 20" fill="none">
                    <path d="M2 10 Q 20 2, 40 10 T 78 10" stroke="#A8E6E3" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="4,4"/>
                </svg>
            </div>
        </div>

        <!-- Decorative divider -->
        <svg class="section-divider" viewBox="0 0 1100 40" fill="none" preserveAspectRatio="none">
            <path d="M0 20 Q 275 0, 550 20 T 1100 20" stroke="#A8E6E3" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="6,6"/>
        </svg>

    </div>
</section>

</body>
</html>
